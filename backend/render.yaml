services:
  - type: web
    name: smart-hospitality-backend
    env: node
    buildCommand: npm install
    startCommand: npm start
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase: true
      - key: JWT_SECRET
        fromDatabase: true
      - key: GROQ_API_KEY
        fromDatabase: true
      - key: GEMINI_API_KEY
        fromDatabase: true
      - key: NODE_ENV
        value: production

  - type: web
    name: smart-hospitality-ai
    env: python-3.9
    buildCommand: cd ai-services && pip install -r requirements.txt
    startCommand: cd ai-services && python app.py
    pythonVersion: 3.9
    envVars:
      - key: GROQ_API_KEY
        fromDatabase: true
      - key: GEMINI_API_KEY
        fromDatabase: true